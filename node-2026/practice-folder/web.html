<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Website</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      header {
        background: #2563eb;
        color: #fff;
        text-align: center;
        padding: 20px;
      }

      nav {
        margin-top: 10px;
      }

      nav a {
        color: #fff;
        text-decoration: none;
        margin: 0 15px;
      }

      .hero {
        text-align: center;
        padding: 60px 20px;
        background: #ffffff;
      }

      .hero h2 {
        margin-bottom: 10px;
      }

      .hero button {
        padding: 10px 20px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 15px;
      }

      .cards {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        padding: 40px 20px;
      }

      .card {
        width: 250px;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .contact {
        width: 400px;
        max-width: 90%;
        margin: 40px auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
      }

      .contact input,
      .contact textarea {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .contact button {
        width: 100%;
        padding: 10px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      footer {
        background: #222;
        color: #fff;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
      }

      @media (max-width: 768px) {
        .cards {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>My Website</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h2>Welcome to My Website</h2>
      <p>This is a simple HTML & CSS example.</p>
      <button>Get Started</button>
    </section>

    <section class="cards">
      <div class="card">
        <h3>Web Design</h3>
        <p>Create beautiful and responsive websites.</p>
      </div>

      <div class="card">
        <h3>Development</h3>
        <p>Build modern web applications.</p>
      </div>

      <div class="card">
        <h3>SEO</h3>
        <p>Improve your website ranking.</p>
      </div>
    </section>

    <section class="contact">
      <h2>Contact Us</h2>

      <input type="text" placeholder="Your Name" />
      <input type="email" placeholder="Your Email" />
      <textarea rows="5" placeholder="Your Message"></textarea>

      <button>Send Message</button>
    </section>

    <footer>
      <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>
  </body>
</html>
